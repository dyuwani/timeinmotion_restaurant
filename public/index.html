<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title id="pageTitle">Time in Motion · Palace Venues</title>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;font-size:13px;}
input,button,select{font-family:inherit;}
button{cursor:pointer;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg-2);}
::-webkit-scrollbar-thumb{background:var(--text-5);border-radius:4px;}

/* ── HEADER ── */
.header{background:var(--bg-1);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;}
.logo-bar{display:flex;align-items:center;gap:10px;}
.logo-stripe{width:5px;height:32px;border-radius:3px;background:linear-gradient(180deg,#6E56F8,#FF6B2B);flex-shrink:0;}
.logo-title{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-1);}
.logo-sub{font-size:10px;color:var(--text-3);margin-top:1px;}
.clock{font-family:monospace;font-size:14px;color:var(--accent);font-weight:700;background:color-mix(in srgb, var(--accent) 10%, transparent);padding:4px 10px;border-radius:6px;border:1px solid color-mix(in srgb, var(--accent) 19%, transparent);}
.hdr-btns{display:flex;gap:8px;align-items:center;}
.btn-sm{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:500;border:1px solid var(--text-5);background:var(--border);color:var(--text-1);}
.btn-sm.active{border-color:var(--c-fire);color:var(--c-fire);background:color-mix(in srgb, var(--c-fire) 10%, transparent);}
.btn-sm.purple{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, transparent);}
.btn-sm.green{border-color:var(--c-serve);color:var(--c-serve);background:color-mix(in srgb, var(--c-serve) 10%, transparent);}

/* ── USE CASE / VENUE BAR ── */
.usecase-bar{background:var(--bg-2);border-bottom:1px solid var(--border);padding:8px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.uc-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.uc-label{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;}
.uc-pill{padding:4px 12px;border-radius:20px;font-size:12px;border:1px solid var(--border);background:transparent;color:var(--text-3);}
.uc-pill.sel{font-weight:700;border-color:var(--accent);background:color-mix(in srgb, var(--accent) 8%, transparent);color:var(--accent);}
.uc-sep{width:1px;height:16px;background:var(--border);margin:0 2px;}

/* ── SESSION BAR ── */
.session-bar{background:var(--bg-2);border-bottom:1px solid var(--border-soft);padding:7px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.session-label-wrap{display:flex;align-items:center;gap:6px;flex:1;min-width:200px;}
.session-lbl{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;}
.session-input{background:var(--bg-3);border:1px solid var(--border);color:var(--text-1);border-radius:4px;padding:4px 10px;font-size:12px;outline:none;width:240px;}
.session-input:focus{border-color:color-mix(in srgb, var(--accent) 38%, transparent);}
.save-status{font-size:11px;color:var(--text-3);font-family:monospace;margin-left:4px;white-space:nowrap;}
.save-status.saved{color:var(--c-serve);}
.save-status.saving{color:var(--c-payment);}
.save-status.error{color:var(--c-close);}

/* ── TABLE TABS ── */
.table-tabs{background:var(--bg-2);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:stretch;overflow-x:auto;min-height:42px;}
.ttab{display:flex;align-items:center;gap:5px;padding:0 12px;cursor:pointer;font-size:12px;color:var(--text-3);border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;}
.ttab.sel{font-weight:700;color:var(--text-1);border-bottom-color:var(--accent);}
.ttab-pill{font-size:9px;background:color-mix(in srgb, var(--accent) 19%, transparent);color:var(--accent);border-radius:10px;padding:1px 5px;}
.ttab-x{font-size:10px;color:var(--text-4);padding:2px;}
.add-tab-btn{padding:0 14px;background:none;border:none;color:var(--accent);font-size:20px;border-bottom:2px solid transparent;}

/* ── SUMMARY PANEL ── */
.summary-panel{background:var(--bg-1);border-bottom:1px solid var(--border);padding:14px 20px;}
.sec-label{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;}
.summary-grid{display:flex;flex-wrap:wrap;gap:8px;}
.summary-card{background:var(--bg-3);border-radius:6px;padding:7px 10px;min-width:120px;}
.sc-label{font-size:9px;text-transform:uppercase;font-weight:600;letter-spacing:.05em;margin-bottom:2px;}
.sc-value{font-family:monospace;font-size:14px;font-weight:700;color:var(--text-1);}
.sc-sub{font-size:9px;color:var(--text-3);margin-top:1px;}
.kitchen-section{margin-top:12px;}
.kitchen-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border-soft);}
.kitchen-row:last-child{border-bottom:none;}
.kitchen-label{font-size:11px;font-weight:600;color:var(--text-1);min-width:120px;}
.kitchen-time{font-family:monospace;font-size:12px;font-weight:700;color:var(--c-fire);min-width:60px;}
.kitchen-detail{font-size:10px;color:var(--text-3);}
.pacing-time{font-family:monospace;font-size:11px;color:var(--c-violet);min-width:60px;}

/* ── BODY ── */
.body-wrap{padding:14px 20px;}
.tx-selector{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.tx-label{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;}
.tx-tab{padding:4px 12px;border-radius:20px;font-size:12px;border:1px solid var(--border);background:transparent;color:var(--text-3);}
.tx-tab.sel{font-weight:700;border-color:var(--accent);background:color-mix(in srgb, var(--accent) 8%, transparent);color:var(--accent);}
.tx-new{padding:4px 12px;border-radius:20px;font-size:12px;border:1px dashed color-mix(in srgb, var(--accent) 31%, transparent);background:transparent;color:var(--accent);}

/* ── PROGRESS ── */
.prog-bar{background:var(--bg-3);border:1px solid var(--border);border-radius:8px;padding:10px 16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:12px;}
.prog-item-label{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;}
.prog-item-val{font-family:monospace;font-size:15px;font-weight:700;}
.progress-track{flex:1;min-width:100px;}
.progress-bg{background:var(--border);border-radius:4px;height:6px;overflow:hidden;margin-top:4px;}
.progress-fill{height:100%;border-radius:4px;transition:width .4s;}

/* ── STEPS TABLE ── */
.steps-table{background:var(--bg-3);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.tbl-outer{overflow-x:auto;}
.tbl-header,.step-row{display:grid;grid-template-columns:20px 175px 150px 82px 82px 72px 150px 100px;gap:0 6px;align-items:center;}
.tbl-header{background:var(--bg-2);padding:8px 14px;border-bottom:1px solid var(--border);}
.tbl-hdr-cell{font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
.min-w{min-width:860px;}
.group-header{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid var(--border-soft);border-top:1px solid var(--border-soft);}
.group-header-label{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;}
.group-header-opt{font-size:9px;color:var(--text-4);margin-left:auto;}
.step-row{padding:9px 14px;border-bottom:1px solid var(--border-soft);border-left:3px solid transparent;transition:background .2s;}
.step-name{font-size:12px;font-weight:600;color:var(--text-1);display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.step-tags{display:flex;gap:3px;margin-top:2px;flex-wrap:wrap;}
.step-tag{font-size:9px;padding:1px 5px;border-radius:10px;}
.step-activity{font-family:monospace;font-size:11px;color:var(--text-2);}
.mono{font-family:monospace;font-size:11px;}
.dur-cell{font-family:monospace;font-size:12px;font-weight:700;}
.obs-input{background:var(--bg-0);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:11px;color:var(--text-1);width:100%;outline:none;}
.obs-input:focus{border-color:color-mix(in srgb, var(--accent) 38%, transparent);}
.action-cell{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;align-items:center;}
.abtn{padding:4px 10px;border-radius:4px;font-size:11px;font-weight:600;}
.abtn-start{background:var(--accent);border:1px solid var(--accent);color:#fff;}
.abtn-fire{background:var(--c-fire);border:1px solid var(--c-fire);color:#fff;}
.abtn-end{background:var(--c-payment);border:1px solid var(--c-payment);color:var(--payment-ink);}
.abtn-skip{background:transparent;border:1px solid var(--text-4);color:var(--text-2);}
.abtn-reset{background:transparent;border:1px solid var(--text-5);color:var(--text-3);font-size:9px;}
.done-check{font-size:12px;color:var(--c-serve);font-weight:700;margin-right:2px;}
.kt-badge{font-size:9px;background:color-mix(in srgb, var(--c-fire) 13%, transparent);color:var(--c-fire);border-radius:10px;padding:1px 6px;font-weight:700;font-family:monospace;margin-left:4px;}
.bottleneck-badge{font-size:9px;background:color-mix(in srgb, var(--c-close) 13%, transparent);color:var(--c-close);border-radius:10px;padding:1px 5px;font-weight:700;}
.tbl-footer{padding:8px 14px;background:var(--bg-2);border-top:1px solid var(--border);display:flex;gap:12px;align-items:center;flex-wrap:wrap;min-width:860px;}
.legend-item{display:flex;align-items:center;gap:4px;}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.legend-txt{font-size:10px;color:var(--text-3);}
.legend-hint{font-size:10px;color:var(--text-4);margin-left:auto;}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:#00000080;display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(3px);}
.modal-overlay.hidden{display:none;}
.modal{background:var(--bg-3);border:1px solid var(--text-5);border-radius:12px;padding:24px;width:520px;max-width:90vw;max-height:80vh;display:flex;flex-direction:column;gap:14px;}
.modal-title{font-size:15px;font-weight:700;color:var(--text-1);}
.modal-sub{font-size:11px;color:var(--text-3);}
.sessions-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:100px;max-height:340px;}
.session-item{background:var(--bg-2);border:1px solid var(--border);border-radius:6px;padding:10px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .15s;}
.session-item:hover{border-color:var(--accent);}
.si-label{font-size:13px;font-weight:600;color:var(--text-1);flex:1;}
.si-meta{font-size:10px;color:var(--text-3);line-height:1.5;}
.si-badge{font-size:9px;background:color-mix(in srgb, var(--accent) 13%, transparent);color:var(--accent);border-radius:10px;padding:2px 7px;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;}
.modal-empty{font-size:12px;color:var(--text-4);text-align:center;padding:24px;}
.modal-loading{font-size:12px;color:var(--text-3);text-align:center;padding:24px;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--bg-3);border:1px solid var(--text-5);border-radius:8px;padding:10px 16px;font-size:12px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;color:var(--text-1);}
.toast.show{opacity:1;}
.toast.ok{border-color:var(--c-serve);color:var(--c-serve);}
.toast.err{border-color:var(--c-close);color:var(--c-close);}

/* ── RESPONSIVE / TABLET + PHONE ──
   The 8-column steps table needs ~860px to lay out as a grid, so tablets
   (iPad portrait included) get the same stacked-card treatment as phones —
   only the chrome (header/session-bar stacking) is phone-only below. */
@media (max-width:1024px){
  .tbl-outer{overflow-x:visible;}
  .min-w{min-width:0;}
  .tbl-header{display:none;}
  .tbl-footer{min-width:0;padding:10px 12px;}
  .legend-hint{margin-left:0;width:100%;}

  .step-row{
    grid-template-columns:20px 1fr 1fr 1fr;
    grid-template-areas:
      "num name name name"
      ".   activity activity activity"
      ".   start end dur"
      ".   obs obs obs"
      ".   actions actions actions";
    row-gap:6px;
    padding:10px 12px;
  }
  .step-row > :nth-child(1){grid-area:num;}
  .step-row > :nth-child(2){grid-area:name;}
  .step-row > :nth-child(3){grid-area:activity;font-size:10px;}
  .step-row > :nth-child(4){grid-area:start;}
  .step-row > :nth-child(5){grid-area:end;}
  .step-row > :nth-child(6){grid-area:dur;}
  .step-row > :nth-child(7){grid-area:obs;}
  .step-row > :nth-child(8){grid-area:actions;}
  .step-row > :nth-child(4)::before{content:"Start ";font-size:9px;color:var(--text-3);}
  .step-row > :nth-child(5)::before{content:"End ";font-size:9px;color:var(--text-3);}
  .step-row > :nth-child(6)::before{content:"Dur ";font-size:9px;color:var(--text-3);}

  .action-cell{justify-content:flex-start;}
  .abtn,.abtn-reset{padding:8px 14px;font-size:12px;flex:0 0 auto;}
  .obs-input{padding:6px 8px;}
}

/* ── RESPONSIVE / PHONE ONLY ── */
@media (max-width:640px){
  .header{flex-wrap:wrap;gap:8px;padding:10px 12px;}
  .logo-sub{display:none;}
  .hdr-btns{width:100%;justify-content:flex-start;flex-wrap:wrap;gap:6px;}
  .clock{font-size:12px;padding:3px 8px;}
  .btn-sm{padding:5px 9px;font-size:10px;}

  .usecase-bar{padding:8px 12px;}
  .uc-sep{display:none;}

  .session-bar{padding:8px 12px;flex-direction:column;align-items:stretch;gap:8px;}
  .session-label-wrap{width:100%;min-width:0;}
  .session-input{width:100%;}
  .session-bar .btn-sm{width:100%;text-align:center;}

  .table-tabs{padding:0 12px;}

  .summary-panel{padding:10px 12px;}
  .summary-card{flex:1 1 45%;min-width:0;}

  .body-wrap{padding:10px 12px;}
  .tx-selector{gap:6px;}
  .prog-bar{padding:8px 10px;gap:12px;}
  .progress-track{flex-basis:100%;}

  .modal{width:92vw;padding:16px;}
}

/* ── RESPONSIVE / TABLET ── give the chrome a bit more breathing room,
   short of the full phone stack (tablets have the width for one row). */
@media (min-width:641px) and (max-width:1024px){
  .header{padding:10px 16px;}
  .session-bar{padding:7px 16px;}
  .body-wrap{padding:14px 16px;}
  .summary-card{flex:1 1 30%;}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo-bar">
    <div class="logo-stripe"></div>
    <div>
      <div class="logo-title" id="logoTitle">Time in Motion &nbsp;·&nbsp; Fine Dining</div>
      <div class="logo-sub" id="logoSub">Medusa by Palace &nbsp;·&nbsp; POS/ECR Service Flow &nbsp;·&nbsp; Modulus Labs</div>
    </div>
  </div>
  <div class="hdr-btns">
    <div class="clock" id="clock">--:--:--</div>
    <button class="btn-sm" id="summaryBtn" onclick="toggleSummary()">🔥 Kitchen Times</button>
    <button class="btn-sm" onclick="exportCSV()">↓ CSV</button>
    <a class="btn-sm" href="report.html" style="text-decoration:none;display:inline-block">📊 Report</a>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
  </div>
</div>

<!-- USE CASE / VENUE -->
<div class="usecase-bar" id="usecaseBar"></div>

<!-- SESSION BAR -->
<div class="session-bar">
  <span class="session-lbl">Session</span>
  <div class="session-label-wrap">
    <input class="session-input" id="sessionLabel" placeholder="e.g. Medusa 19 Aug — First Seating" />
    <span class="save-status" id="saveStatus">● Unsaved</span>
  </div>
  <button class="btn-sm green" onclick="saveSession()">💾 Save</button>
  <button class="btn-sm purple" onclick="showLoadModal()">📂 Load Session</button>
  <button class="btn-sm" onclick="newSession()">＋ New</button>
</div>

<!-- TABLE TABS -->
<div class="table-tabs" id="tableTabs"></div>

<!-- SUMMARY -->
<div id="summaryPanel" class="summary-panel" style="display:none">
  <div id="summaryContent"></div>
</div>

<!-- BODY -->
<div class="body-wrap" id="bodyWrap"></div>

<!-- LOAD MODAL -->
<div class="modal-overlay hidden" id="loadModal">
  <div class="modal">
    <div class="modal-title">📂 Load Saved Session</div>
    <div class="modal-sub">Select a previously saved observation session to restore.</div>
    <div class="sessions-list" id="sessionsList"><div class="modal-loading">Loading sessions…</div></div>
    <div class="modal-footer">
      <button class="btn-sm" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="steps-config.js"></script>
<script>
/* ═══════════════════════════════════════════════════════
   STATE (step definitions live in steps-config.js, shared with report.html)
═══════════════════════════════════════════════════════ */
let activeUseCase="finedining";
let activeVenue=USE_CASES[activeUseCase].venues[0];
let STEP_GROUPS=USE_CASES[activeUseCase].groups;
let STEPS=buildSteps(STEP_GROUPS);
let FIRE_SERVE_PAIRS=USE_CASES[activeUseCase].firePairs;
let tables=[],activeTableId=null,txCounter=100,tableCounter=10,showSummary=false;
let sessionId=genSessionId(),autoSaveTimer=null;

function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');}
function genSessionId(){
  const d=new Date();
  return `${slug(activeVenue)}-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${Date.now().toString(36)}`;
}

/* ═══════════════════════════════════════════════════════
   HELPERS (fmtTime/fmtDur/esc live in steps-config.js, shared with report.html)
═══════════════════════════════════════════════════════ */
function mkStep(){return{startTime:null,endTime:null,duration:null,observation:"",status:"pending"};}
function mkTx(label){const steps={};STEPS.forEach(s=>{steps[s.id]=mkStep();});return{id:++txCounter,label:label||"Tx 1",steps,createdAt:new Date().toISOString()};}
function defaultUnitLabel(n){return `${USE_CASES[activeUseCase].unitLabel} ${n}`;}
function mkTable(label){const tx=mkTx("Tx 1");return{id:++tableCounter,label:label||defaultUnitLabel(1),transactions:[tx],activeTxId:tx.id};}
function getActiveTable(){return tables.find(t=>t.id===activeTableId);}
function getActiveTx(){const t=getActiveTable();return t?t.transactions.find(tx=>tx.id===t.activeTxId):null;}
function getDone(tx){return STEPS.filter(s=>tx.steps[s.id].status==="complete").length;}
function getTotalDur(tx){
  const starts=STEPS.map(s=>tx.steps[s.id].startTime).filter(Boolean).map(d=>new Date(d).getTime());
  const ends=STEPS.map(s=>tx.steps[s.id].endTime).filter(Boolean).map(d=>new Date(d).getTime());
  if(!starts.length||!ends.length)return null;
  return Math.max(...ends)-Math.min(...starts);
}
function getKitchenTimes(tx){
  return FIRE_SERVE_PAIRS.map(pair=>{
    const fs=tx.steps[pair.fireId],ss=tx.steps[pair.serveId];
    if(!fs||!ss||fs.status==="skipped"||ss.status==="skipped")return{label:pair.label,kt:null,pending:true};
    const kt=(fs.startTime&&ss.startTime)?new Date(ss.startTime)-new Date(fs.startTime):null;
    return{label:pair.label,kt,fired:fs.startTime,served:ss.startTime,fireStatus:fs.status,serveStatus:ss.status};
  }).filter(p=>!p.pending);
}
function getMaxDurStepId(tx){let max=0,maxId=null;STEPS.forEach(s=>{if(tx.steps[s.id].duration>max){max=tx.steps[s.id].duration;maxId=s.id;}});return maxId;}

/* ═══════════════════════════════════════════════════════
   ACTIONS
═══════════════════════════════════════════════════════ */
function startStep(sid){const tx=getActiveTx();if(!tx)return;tx.steps[sid]={...tx.steps[sid],startTime:new Date().toISOString(),status:"active"};markUnsaved();render();}
function endStep(sid){
  const tx=getActiveTx();if(!tx)return;
  const step=tx.steps[sid],end=new Date().toISOString();
  tx.steps[sid]={...step,endTime:end,duration:step.startTime?new Date(end)-new Date(step.startTime):null,status:"complete"};
  markUnsaved();render();
}
function skipStep(sid){const tx=getActiveTx();if(!tx)return;tx.steps[sid]={...tx.steps[sid],startTime:null,endTime:null,duration:null,status:"skipped"};markUnsaved();render();}
function resetStep(sid){const tx=getActiveTx();if(!tx)return;tx.steps[sid]=mkStep();markUnsaved();render();}
function setObs(sid,v){const tx=getActiveTx();if(tx){tx.steps[sid].observation=v;scheduleAutoSave();}}
function addTable(){const n=tables.length+1;const t=mkTable(defaultUnitLabel(n));tables.push(t);activeTableId=t.id;markUnsaved();render();}
function removeTable(id){if(tables.length===1)return;tables=tables.filter(t=>t.id!==id);if(activeTableId===id)activeTableId=tables[0].id;markUnsaved();render();}
function setActiveTable(id){activeTableId=id;render();}
function addTx(){const table=getActiveTable();if(!table)return;const n=table.transactions.length+1;const tx=mkTx("Tx "+n);table.transactions.push(tx);table.activeTxId=tx.id;markUnsaved();render();}
function setActiveTx(txId){const t=getActiveTable();if(t){t.activeTxId=txId;render();}}
function toggleSummary(){showSummary=!showSummary;render();}
function startRenameTable(id){const t=tables.find(t=>t.id===id);const label=prompt("Rename table:",t?t.label:"");if(label!==null&&label.trim()){if(t)t.label=label.trim();markUnsaved();render();}}

function defaultSessionLabel(){return `${activeVenue} ${new Date().toLocaleDateString('en-PH',{day:'2-digit',month:'short',year:'numeric'})}`;}
function resetTables(){tables=[];txCounter=100;tableCounter=10;sessionId=genSessionId();const t1=mkTable(defaultUnitLabel(1));tables.push(t1);activeTableId=t1.id;}
function newSession(){
  if(!confirm("Start a fresh session? Current unsaved data will be lost."))return;
  resetTables();
  document.getElementById('sessionLabel').value=defaultSessionLabel();
  setSaveStatus('','● Unsaved');
  render();
}

function applyBranding(){
  const uc=USE_CASES[activeUseCase];
  document.getElementById('logoTitle').innerHTML=`Time in Motion &nbsp;·&nbsp; ${esc(uc.label)}`;
  document.getElementById('logoSub').innerHTML=`${esc(activeVenue)} &nbsp;·&nbsp; ${esc(uc.subtitle)} &nbsp;·&nbsp; Modulus Labs`;
  document.title=`Time in Motion · ${uc.label} · ${activeVenue}`;
  document.getElementById('summaryBtn').textContent=uc.fireBtnLabel;
  document.getElementById('sessionLabel').placeholder=`e.g. ${activeVenue} ${new Date().toLocaleDateString('en-PH',{day:'2-digit',month:'short'})} — First ${activeUseCase==="clubs"?"Group":"Seating"}`;
}

// Switch use case and/or venue. Steps differ per use case, so existing tx data
// can't carry over — behaves like "New Session" for the new context.
function switchContext(key,venue,opts={}){
  if(!opts.skipConfirm){
    const hasProgress=tables.some(t=>t.transactions.some(tx=>Object.values(tx.steps).some(s=>s.status!=="pending")));
    if(hasProgress&&!confirm("Switching will start a fresh session and clear unsaved observations. Continue?"))return false;
  }
  activeUseCase=key;
  const uc=USE_CASES[key];
  activeVenue=venue||uc.venues[0];
  STEP_GROUPS=uc.groups;
  STEPS=buildSteps(STEP_GROUPS);
  FIRE_SERVE_PAIRS=uc.firePairs;
  resetTables();
  applyBranding();
  document.getElementById('sessionLabel').value=defaultSessionLabel();
  setSaveStatus('','● Unsaved');
  render();
  return true;
}
function selectUseCase(key){if(key===activeUseCase)return;switchContext(key,USE_CASES[key].venues[0]);}
function selectVenue(v){if(v===activeVenue)return;switchContext(activeUseCase,v);}

/* ═══════════════════════════════════════════════════════
   SAVE / LOAD
═══════════════════════════════════════════════════════ */
function getSaveLabel(){return document.getElementById('sessionLabel').value.trim()||sessionId;}

function setSaveStatus(state,msg){
  const el=document.getElementById('saveStatus');
  el.textContent=msg;
  el.className='save-status '+state;
}

function markUnsaved(){setSaveStatus('','● Unsaved');scheduleAutoSave();}

function scheduleAutoSave(){
  clearTimeout(autoSaveTimer);
  autoSaveTimer=setTimeout(()=>saveSession(true),30000); // auto-save after 30s idle
}

async function saveSession(silent=false){
  setSaveStatus('saving','◌ Saving…');
  const label=getSaveLabel()||defaultSessionLabel();
  try{
    const res=await fetch('/api/save',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sessionId,label,tables,useCase:activeUseCase,venue:activeVenue}),
    });
    const data=await res.json();
    if(!res.ok){console.error('[save] /api/save failed:',data);throw new Error(data.detail||data.error||'Save failed');}
    setSaveStatus('saved','✓ Saved '+(new Date().toLocaleTimeString('en-PH',{hour12:false})));
    if(!silent)toast('Session saved ✓','ok');
  }catch(err){
    setSaveStatus('error','✕ Save failed');
    if(!silent)toast('Save failed: '+err.message,'err');
  }
}

async function showLoadModal(){
  document.getElementById('loadModal').classList.remove('hidden');
  const list=document.getElementById('sessionsList');
  list.innerHTML='<div class="modal-loading">Loading sessions…</div>';
  try{
    const res=await fetch('/api/sessions');
    const data=await res.json();
    if(!res.ok){console.error('[sessions] /api/sessions failed:',data);throw new Error(data.detail||data.error||'Failed to load sessions');}
    const sessions=data.sessions||[];
    if(!sessions.length){list.innerHTML='<div class="modal-empty">No saved sessions yet.<br>Save a session to see it here.</div>';return;}
    list.innerHTML=sessions.map(s=>`
      <div class="session-item" onclick="loadSession('${esc(s.id)}')">
        <div style="flex:1">
          <div class="si-label">${esc(s.label)} <span class="si-badge" style="margin-left:4px">${esc(USE_CASES[s.useCase]?.icon||"🍽️")} ${esc(s.venue||USE_CASES[s.useCase]?.label||"Fine Dining")}</span></div>
          <div class="si-meta">${esc(s.id)} &nbsp;·&nbsp; ${s.tableCount} table${s.tableCount!==1?'s':''} &nbsp;·&nbsp; ${s.txCount||0} tx</div>
          <div class="si-meta">${new Date(s.savedAt).toLocaleString('en-PH')}</div>
        </div>
        <span class="si-badge">Load →</span>
      </div>`).join('');
  }catch(err){
    list.innerHTML=`<div class="modal-empty" style="color:var(--c-close)">Error: ${esc(err.message)}</div>`;
  }
}

async function loadSession(id){
  closeModal();
  try{
    const res=await fetch(`/api/load?id=${encodeURIComponent(id)}`);
    const data=await res.json();
    if(!res.ok){console.error('[load] /api/load failed:',data);throw new Error(data.detail||data.error||'Failed to load session');}
    const s=data.session;
    // Apply the use case/venue this session was saved under BEFORE assigning
    // tables — the step IDs only make sense against the matching STEP_GROUPS.
    const key=USE_CASES[s.useCase]?s.useCase:'finedining';
    activeUseCase=key;
    activeVenue=s.venue||USE_CASES[key].venues[0];
    STEP_GROUPS=USE_CASES[key].groups;
    STEPS=buildSteps(STEP_GROUPS);
    FIRE_SERVE_PAIRS=USE_CASES[key].firePairs;
    applyBranding();
    tables=s.tables;
    sessionId=s.id;
    document.getElementById('sessionLabel').value=s.label||'';
    activeTableId=tables[0]?.id||null;
    // Fix counters
    tables.forEach(t=>{tableCounter=Math.max(tableCounter,t.id+1);t.transactions.forEach(tx=>{txCounter=Math.max(txCounter,tx.id+1);});});
    setSaveStatus('saved','✓ Loaded: '+(new Date(s.savedAt).toLocaleTimeString('en-PH',{hour12:false})));
    render();
    toast('Session loaded ✓','ok');
  }catch(err){
    toast('Load failed: '+err.message,'err');
  }
}

function closeModal(){document.getElementById('loadModal').classList.add('hidden');}

function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='toast show '+(type==='ok'?'ok':'err');
  setTimeout(()=>{el.className='toast';},3000);
}

/* ═══════════════════════════════════════════════════════
   EXPORT
═══════════════════════════════════════════════════════ */
function exportCSV(){
  const hdr=["Use Case","Venue","Table","Transaction","Group","Step #","Step","Type","POS/ECR Activity","Optional","Start Time","End Time","Duration (s)","Observation","Status"];
  const rows=[hdr.join(",")];
  const ucLabel=USE_CASES[activeUseCase].label;
  tables.forEach(table=>{
    table.transactions.forEach(tx=>{
      STEPS.forEach(s=>{
        const step=tx.steps[s.id];
        rows.push([
          '"'+ucLabel+'"','"'+activeVenue+'"','"'+table.label+'"','"'+tx.label+'"','"'+s.groupLabel+'"',s.id,'"'+s.step+'"',s.type,
          '"'+s.activity+'"',s.optional?"Y":"N",
          step.startTime?fmtTime(new Date(step.startTime)):"",
          step.endTime?fmtTime(new Date(step.endTime)):"",
          step.duration!==null?Math.floor(step.duration/1000):"",
          '"'+(step.observation||'').replace(/"/g,'""')+'"',step.status
        ].join(","));
      });
    });
  });
  const blob=new Blob([rows.join("\n")],{type:"text/csv"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=`tim-${slug(activeUseCase)}-${slug(activeVenue)}.csv`;a.click();URL.revokeObjectURL(url);
}

/* ═══════════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════════ */
function renderUseCaseBar(){
  const uc=USE_CASES[activeUseCase];
  let html=`<div class="uc-group"><span class="uc-label">Use Case</span>`;
  Object.values(USE_CASES).forEach(u=>{
    html+=`<button class="uc-pill${u.key===activeUseCase?" sel":""}" onclick="selectUseCase('${u.key}')">${u.icon} ${esc(u.label)}</button>`;
  });
  html+=`</div><div class="uc-sep"></div><div class="uc-group"><span class="uc-label">Venue</span>`;
  uc.venues.forEach(v=>{
    html+=`<button class="uc-pill${v===activeVenue?" sel":""}" onclick="selectVenue('${esc(v).replace(/'/g,"\\'")}')">${esc(v)}</button>`;
  });
  html+=`</div>`;
  document.getElementById("usecaseBar").innerHTML=html;
}

function render(){
  const now=new Date();
  document.getElementById("clock").textContent=fmtTime(now);
  renderUseCaseBar();

  // ── TABLE TABS ──
  let tabsHTML="";
  tables.forEach(t=>{
    const total=t.transactions.reduce((a,tx)=>a+getDone(tx),0);
    const max=t.transactions.length*STEPS.length;
    tabsHTML+=`<div class="ttab${t.id===activeTableId?" sel":""}" onclick="setActiveTable(${t.id})">
      <span ondblclick="event.stopPropagation();startRenameTable(${t.id})">${esc(t.label)}</span>
      ${total>0?`<span class="ttab-pill">${total}/${max}</span>`:""}
      ${tables.length>1?`<span class="ttab-x" onclick="event.stopPropagation();removeTable(${t.id})">✕</span>`:""}
    </div>`;
  });
  tabsHTML+=`<button class="add-tab-btn" onclick="addTable()">+</button>`;
  document.getElementById("tableTabs").innerHTML=tabsHTML;

  // ── SUMMARY ──
  const sp=document.getElementById("summaryPanel");
  sp.style.display=showSummary?"block":"none";
  document.getElementById("summaryBtn").className="btn-sm"+(showSummary?" active":"");

  const table=getActiveTable();
  const tx=getActiveTx();

  if(showSummary&&tx){
    const kts=getKitchenTimes(tx);
    const maxKt=kts.reduce((mx,p)=>p.kt>mx?p.kt:mx,-1);
    const totalDur=getTotalDur(tx);
    const done=getDone(tx);
    let sc=`<div class="sec-label">Service Summary · ${esc(table?.label||"")} · Current Transaction</div>
    <div class="summary-grid">
      <div class="summary-card" style="border:1px solid ${tint("var(--accent)",19)}"><div class="sc-label" style="color:var(--accent)">${USE_CASES[activeUseCase].durationLabel}</div><div class="sc-value">${totalDur!==null?fmtDur(totalDur):"—"}</div></div>
      <div class="summary-card" style="border:1px solid ${tint("var(--c-serve)",19)}"><div class="sc-label" style="color:var(--c-serve)">Steps Complete</div><div class="sc-value">${done} / ${STEPS.length}</div></div>`;
    const payInitStep=STEPS.find(s=>s.step==="Payment Initiated"),payDoneStep=STEPS.find(s=>s.step==="Payment Completed");
    const p28=payInitStep?tx.steps[payInitStep.id]:null,p29=payDoneStep?tx.steps[payDoneStep.id]:null;
    const payTime=(p28&&p29&&p28.startTime&&p29.startTime)?new Date(p29.startTime)-new Date(p28.startTime):null;
    sc+=`<div class="summary-card" style="border:1px solid ${tint("var(--c-payment)",19)}"><div class="sc-label" style="color:var(--c-payment)">Payment Processing</div><div class="sc-value">${payTime!==null?fmtDur(payTime):"—"}</div></div></div>`;
    if(kts.length){
      sc+=`<div class="kitchen-section"><div class="sec-label" style="margin-top:12px">${USE_CASES[activeUseCase].fireSectionLabel}</div>`;
      kts.forEach(p=>{const isMax=p.kt===maxKt&&p.kt>0;sc+=`<div class="kitchen-row"><div class="kitchen-label">${esc(p.label)}</div><div class="kitchen-time" style="color:${isMax?"var(--c-close)":"var(--c-fire)"}">${p.kt!==null?fmtDur(p.kt):"⏳ active"}</div><div class="kitchen-detail">Fired: ${p.fired?fmtTime(new Date(p.fired)):"—"} → Served: ${p.served?fmtTime(new Date(p.served)):"—"}${isMax?' <span style="color:var(--c-close);font-size:9px;font-weight:700">◀ SLOWEST</span>':""}</div></div>`;});
      sc+=`</div>`;
    }
    document.getElementById("summaryContent").innerHTML=sc;
  }

  if(!table||!tx){document.getElementById("bodyWrap").innerHTML="";return;}

  const maxDurId=getMaxDurStepId(tx);
  const done=getDone(tx);
  const totalDur=getTotalDur(tx);
  const activeCt=STEPS.filter(s=>tx.steps[s.id].status==="active").length;

  let html=`<div class="tx-selector"><span class="tx-label">Transaction</span>`;
  table.transactions.forEach((t,i)=>{
    const d=getDone(t);
    html+=`<button class="tx-tab${t.id===table.activeTxId?" sel":""}" onclick="setActiveTx(${t.id})">Tx ${i+1}${d>0?` <small style="opacity:.65;font-size:9px">(${d}/${STEPS.length})</small>`:""}</button>`;
  });
  html+=`<button class="tx-new" onclick="addTx()">${esc(USE_CASES[activeUseCase].txLabel)}</button></div>
  <div class="prog-bar">
    <div class="prog-item"><div class="prog-item-label">${USE_CASES[activeUseCase].durationLabel}</div><div class="prog-item-val" style="color:var(--accent)">${totalDur!==null?fmtDur(totalDur):"--"}</div></div>
    <div class="prog-item"><div class="prog-item-label">Steps Done</div><div class="prog-item-val" style="color:var(--c-serve)">${done} / ${STEPS.length}</div></div>
    <div class="prog-item"><div class="prog-item-label">Active</div><div class="prog-item-val" style="color:var(--c-payment)">${activeCt}</div></div>
    <div class="prog-item"><div class="prog-item-label">${USE_CASES[activeUseCase].startLabel}</div><div class="prog-item-val" style="color:var(--text-2);font-size:13px">${fmtTime(new Date(tx.createdAt))}</div></div>
    <div class="progress-track"><div class="prog-item-label">Progress</div><div class="progress-bg"><div class="progress-fill" style="background:linear-gradient(90deg,var(--accent),var(--c-fire),var(--c-serve));width:${(done/STEPS.length)*100}%"></div></div></div>
  </div>
  <div class="steps-table"><div class="tbl-outer"><div class="min-w">
  <div class="tbl-header"><div class="tbl-hdr-cell">#</div><div class="tbl-hdr-cell">Step</div><div class="tbl-hdr-cell">POS/ECR Activity</div><div class="tbl-hdr-cell">Start Time</div><div class="tbl-hdr-cell">End Time</div><div class="tbl-hdr-cell">Duration</div><div class="tbl-hdr-cell">Observation</div><div class="tbl-hdr-cell"></div></div>`;

  STEP_GROUPS.forEach(group=>{
    const groupDone=group.steps.filter(s=>tx.steps[s.id].status==="complete").length;
    const pair=FIRE_SERVE_PAIRS.find(p=>group.steps.some(s=>s.id===p.fireId)&&group.steps.some(s=>s.id===p.serveId));
    let ktBadge="";
    if(pair){const fs=tx.steps[pair.fireId],ss=tx.steps[pair.serveId];if(fs&&ss&&fs.startTime&&ss.startTime){const kt=new Date(ss.startTime)-new Date(fs.startTime);ktBadge=`<span class="kt-badge">🔥→🍽️ ${fmtDur(kt)}</span>`;}}
    html+=`<div class="group-header" style="background:${tint(group.color,4)};border-left:3px solid ${tint(group.color,31)}"><span>${group.icon}</span><span class="group-header-label" style="color:${group.color}">${esc(group.label)}</span>${ktBadge}<span class="group-header-opt">${groupDone}/${group.steps.length} done</span></div>`;

    group.steps.forEach(s=>{
      const step=tx.steps[s.id];
      const isMax=step.status==="complete"&&s.id===maxDurId;
      const elapsedMs=step.status==="active"&&step.startTime?now-new Date(step.startTime):null;
      const tc=TYPE_COLORS[s.type];
      const isFireStep=s.type==="fire";
      let bc,bg;
      if(step.status==="active"){bc="var(--c-payment)";bg=tint("var(--c-payment)",4);}
      else if(step.status==="complete"){bc=tc;bg=isMax?tint("var(--c-close)",3):tint(tc,3);}
      else if(step.status==="skipped"){bc="var(--text-4)";bg=tint("var(--text-4)",2);}
      else{bc=isFireStep?tint("var(--c-fire)",25):tint(tc,19);bg=isFireStep?tint("var(--c-fire)",2):"transparent";}

      const startStr=step.startTime?`<span style="color:var(--text-1)">${fmtTime(new Date(step.startTime))}</span>`:`<span style="color:var(--text-5)">--:--:--</span>`;
      const endStr=step.endTime?`<span style="color:var(--text-1)">${fmtTime(new Date(step.endTime))}</span>`:step.status==="active"?`<span style="color:var(--c-payment);font-weight:700">⏱ live</span>`:`<span style="color:var(--text-5)">--:--:--</span>`;
      let durStr;
      if(step.status==="skipped")durStr=`<span style="color:var(--text-4);font-size:10px">Skipped</span>`;
      else if(step.duration!==null)durStr=`<span style="color:${isMax?"var(--c-close)":tc}">${fmtDur(step.duration)}</span>`;
      else if(elapsedMs!==null)durStr=`<span style="color:var(--c-payment)">${fmtDur(elapsedMs)}</span>`;
      else durStr=`<span style="color:var(--text-5)">--</span>`;

      let actions="";
      if(step.status==="pending"){
        actions=isFireStep?`<button class="abtn abtn-fire" onclick="startStep(${s.id})">🔥 Fire</button>`:`<button class="abtn abtn-start" onclick="startStep(${s.id})">Start</button>`;
        if(s.optional)actions+=`<button class="abtn abtn-skip" onclick="skipStep(${s.id})">Skip</button>`;
      }else if(step.status==="active"){actions=`<button class="abtn abtn-end" onclick="endStep(${s.id})">End</button>`;}
      else if(step.status==="complete"){actions=`<span class="done-check">✓</span><button class="abtn abtn-reset" onclick="resetStep(${s.id})">Reset</button>`;}
      else if(step.status==="skipped"){actions=`<button class="abtn abtn-reset" onclick="resetStep(${s.id})">Undo</button>`;}

      const obsVal=(step.observation||'').replace(/&/g,"&amp;").replace(/"/g,"&quot;");
      const nameDisplay=isFireStep?`<span style="color:var(--c-fire)">${esc(s.step)}</span>`:esc(s.step);
      html+=`<div class="step-row" style="border-left-color:${bc};background:${bg}">
        <div style="font-size:10px;color:${tint(tc,50)};font-weight:700">${s.id}</div>
        <div><div class="step-name">${nameDisplay}${isMax?`<span class="bottleneck-badge">SLOWEST</span>`:""}</div><div class="step-tags"><span class="step-tag" style="background:${tint(tc,20)};color:${tc};font-weight:${isFireStep?700:400}">${TYPE_LABELS[s.type]}</span>${s.optional?`<span class="step-tag" style="background:${tint("var(--text-2)",20)};color:var(--text-2)">Optional</span>`:""}</div></div>
        <div class="step-activity">${esc(s.activity)}</div>
        <div class="mono">${startStr}</div>
        <div class="mono">${endStr}</div>
        <div class="dur-cell">${durStr}</div>
        <div><input class="obs-input" value="${obsVal}" placeholder="${step.status==="active"?"Observing...":step.status==="complete"?"Add note...":""}" oninput="setObs(${s.id},this.value)" style="opacity:${step.status==="pending"?.3:1}"></div>
        <div class="action-cell">${actions}</div>
      </div>`;
    });
  });

  html+=`</div></div>
  <div class="tbl-footer">
    ${Object.entries(TYPE_LABELS).map(([t,l])=>`<div class="legend-item"><div class="legend-dot" style="background:${TYPE_COLORS[t]}"></div><span class="legend-txt">${l}</span></div>`).join("")}
    <span class="legend-hint">🔥 Fire = kitchen instruction &nbsp;·&nbsp; Double-click table name to rename &nbsp;·&nbsp; Data auto-saves after 30s idle</span>
  </div></div></div>`;

  document.getElementById("bodyWrap").innerHTML=html;
}

/* ═══════════════════════════════════════════════════════
   TICK
═══════════════════════════════════════════════════════ */
setInterval(()=>{
  const tx=getActiveTx();
  const hasActive=tx&&STEPS.some(s=>tx.steps[s.id].status==="active");
  if(hasActive||showSummary)render();
  else document.getElementById("clock").textContent=fmtTime(new Date());
},1000);

/* ═══════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════ */
const t1=mkTable(defaultUnitLabel(1));
tables.push(t1);
activeTableId=t1.id;
sessionId=genSessionId();
applyBranding();
document.getElementById('sessionLabel').value=defaultSessionLabel();
render();

// Deep link from the report page: index.html?load=<sessionId> opens straight
// into that saved session instead of a blank one.
const deepLinkId=new URLSearchParams(location.search).get('load');
if(deepLinkId)loadSession(deepLinkId);
</script>
