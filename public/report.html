<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Time in Motion · Reports</title>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;font-size:13px;}
input,button,select{font-family:inherit;}
button{cursor:pointer;}
a{color:inherit;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg-2);}
::-webkit-scrollbar-thumb{background:var(--text-5);border-radius:4px;}

/* ── HEADER ── */
.header{background:var(--bg-1);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.logo-bar{display:flex;align-items:center;gap:10px;}
.logo-stripe{width:5px;height:32px;border-radius:3px;background:linear-gradient(180deg,#6E56F8,#FF6B2B);flex-shrink:0;}
.logo-title{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-1);}
.logo-sub{font-size:10px;color:var(--text-3);margin-top:1px;}
.hdr-btns{display:flex;gap:8px;align-items:center;}
.btn-sm{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:500;border:1px solid var(--text-5);background:var(--border);color:var(--text-1);text-decoration:none;display:inline-block;}
.btn-sm.sel{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb, var(--accent) 10%, transparent);}

/* ── FILTER BAR ── */
.filter-bar{background:var(--bg-2);border-bottom:1px solid var(--border);padding:8px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.f-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.f-label{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;}
.f-pill{padding:4px 12px;border-radius:20px;font-size:12px;border:1px solid var(--border);background:transparent;color:var(--text-3);}
.f-pill.sel{font-weight:700;border-color:var(--accent);background:color-mix(in srgb, var(--accent) 8%, transparent);color:var(--accent);}
.f-search{background:var(--bg-3);border:1px solid var(--border);color:var(--text-1);border-radius:4px;padding:5px 10px;font-size:12px;outline:none;width:220px;margin-left:auto;}
.f-search:focus{border-color:color-mix(in srgb, var(--accent) 38%, transparent);}

/* ── BODY ── */
.body-wrap{padding:18px 20px;max-width:1100px;margin:0 auto;}
.state-msg{text-align:center;padding:60px 20px;color:var(--text-3);font-size:13px;}
.state-msg.err{color:var(--c-close);}

.overview-grid{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.stat-tile{background:var(--bg-3);border:1px solid var(--border);border-radius:8px;padding:12px 16px;flex:1;min-width:150px;}
.stat-label{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.stat-value{font-family:monospace;font-size:22px;font-weight:700;color:var(--text-1);}
.stat-sub{font-size:10px;color:var(--text-3);margin-top:3px;}

.section{background:var(--bg-1);border:1px solid var(--border);border-radius:10px;margin-bottom:18px;overflow:hidden;}
.section-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.section-title{font-size:14px;font-weight:700;color:var(--text-1);}
.section-sub{font-size:11px;color:var(--text-3);}
.section-body{padding:16px 18px;}
.sec-label{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;margin:0 0 10px;}
.sec-label:not(:first-child){margin-top:18px;}

/* ── BAR CHART (rounded, single-hue length encoding; legend used only for multi-series) ── */
.legend-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-2);}
.legend-swatch{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.bar-row{display:flex;align-items:center;gap:10px;padding:5px 0;}
.bar-label{width:150px;flex-shrink:0;font-size:11px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{flex:1;height:10px;background:var(--border-soft);border-radius:5px;overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;min-width:2px;transition:width .3s;}
.bar-value{width:76px;flex-shrink:0;text-align:right;font-family:monospace;font-size:11px;color:var(--text-1);}
.bar-n{font-size:9px;color:var(--text-4);margin-left:4px;}
.bar-empty{font-size:11px;color:var(--text-4);padding:8px 0;}

/* ── VENUE CARDS ── */
.venue-grid{display:flex;gap:10px;flex-wrap:wrap;}
.venue-card{flex:1;min-width:150px;background:var(--bg-3);border:1px solid var(--border);border-radius:8px;padding:10px 14px;border-left:3px solid transparent;}
.venue-name{font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--text-1);}
.venue-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.venue-stat{font-family:monospace;font-size:16px;font-weight:700;margin-top:6px;}
.venue-sub{font-size:10px;color:var(--text-3);margin-top:2px;}

/* ── SESSIONS TABLE ── */
.tbl-wrap{overflow-x:auto;}
table.sessions{width:100%;border-collapse:collapse;font-size:12px;}
table.sessions th{text-align:left;font-size:9px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:6px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
table.sessions td{padding:8px 10px;border-bottom:1px solid var(--border-soft);white-space:nowrap;color:var(--text-1);}
table.sessions tbody tr:hover{background:var(--bg-3);}
.venue-chip{font-size:9px;padding:2px 7px;border-radius:10px;font-weight:600;}
.open-link{font-size:11px;color:var(--accent);text-decoration:none;font-weight:600;}
.open-link:hover{text-decoration:underline;}

@media (max-width:640px){
  .header{padding:10px 12px;}
  .logo-sub{display:none;}
  .filter-bar{padding:8px 12px;}
  .f-search{width:100%;margin-left:0;}
  .body-wrap{padding:12px;}
  .stat-tile{min-width:0;flex:1 1 45%;}
  .bar-label{width:96px;font-size:10px;}
  .venue-card{min-width:0;flex:1 1 100%;}
}

/* ── TABLET ── */
@media (min-width:641px) and (max-width:1024px){
  .header{padding:10px 16px;}
  .filter-bar{padding:8px 16px;}
  .body-wrap{padding:16px;max-width:100%;}
  .stat-tile{min-width:0;flex:1 1 30%;}
  .bar-label{width:120px;}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo-bar">
    <div class="logo-stripe"></div>
    <div>
      <div class="logo-title">📊 Time in Motion &nbsp;·&nbsp; Reports</div>
      <div class="logo-sub">Saved sessions across all venues &nbsp;·&nbsp; Modulus Labs</div>
    </div>
  </div>
  <div class="hdr-btns">
    <button class="btn-sm" onclick="loadReport()">↻ Refresh</button>
    <a class="btn-sm" href="index.html">← Tracker</a>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
  </div>
</div>

<!-- FILTERS -->
<div class="filter-bar">
  <div class="f-group">
    <span class="f-label">Use Case</span>
    <button class="f-pill sel" data-usecase="all" onclick="setUseCaseFilter('all')">All</button>
    <button class="f-pill" data-usecase="finedining" onclick="setUseCaseFilter('finedining')">🍽️ Fine Dining</button>
    <button class="f-pill" data-usecase="clubs" onclick="setUseCaseFilter('clubs')">🥂 Clubs</button>
  </div>
  <div class="f-group" id="venueFilterGroup" style="display:none">
    <span class="f-label">Venue</span>
    <button class="f-pill sel" data-venue="" onclick="setVenueFilter('')">All</button>
  </div>
  <input class="f-search" id="searchInput" placeholder="Search session label…" oninput="onSearch(this.value)" />
</div>

<!-- BODY -->
<div class="body-wrap" id="bodyWrap">
  <div class="state-msg" id="stateMsg">Loading saved sessions…</div>
</div>

<script src="steps-config.js"></script>
<script>
let allSessions=[];
let filters={useCase:'all',venue:'',search:''};

function avg(arr){const v=arr.filter(x=>x!==null&&x!==undefined&&!isNaN(x));return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
function pct(x){return x===null?"—":Math.round(x*100)+"%";}

/* ═══════════════════════════════════════════════════════
   AGGREGATION
═══════════════════════════════════════════════════════ */
function computeTxStats(session,table,tx,steps,firePairs){
  const stepVals=steps.map(s=>tx.steps?.[s.id]).filter(Boolean);
  const starts=stepVals.map(s=>s.startTime).filter(Boolean).map(d=>new Date(d).getTime());
  const ends=stepVals.map(s=>s.endTime).filter(Boolean).map(d=>new Date(d).getTime());
  const totalDur=(starts.length&&ends.length)?Math.max(...ends)-Math.min(...starts):null;
  const done=steps.filter(s=>tx.steps?.[s.id]?.status==="complete").length;
  const completion=steps.length?done/steps.length:null;
  const payInit=steps.find(s=>s.step==="Payment Initiated"),payDone=steps.find(s=>s.step==="Payment Completed");
  const p1=payInit&&tx.steps?.[payInit.id],p2=payDone&&tx.steps?.[payDone.id];
  const payTime=(p1&&p2&&p1.startTime&&p2.startTime)?new Date(p2.startTime)-new Date(p1.startTime):null;
  const kts={};
  firePairs.forEach(pair=>{
    const fs=tx.steps?.[pair.fireId],ss=tx.steps?.[pair.serveId];
    if(fs&&ss&&fs.startTime&&ss.startTime&&fs.status!=="skipped"&&ss.status!=="skipped"){
      kts[pair.label]=new Date(ss.startTime)-new Date(fs.startTime);
    }
  });
  return {session,table,tx,totalDur,completion,payTime,kts};
}

function buildReport(sessions){
  const report={
    finedining:{uc:USE_CASES.finedining,sessions:[],txStats:[]},
    clubs:{uc:USE_CASES.clubs,sessions:[],txStats:[],byVenue:{}},
  };
  sessions.forEach(session=>{
    const key=USE_CASES[session.useCase]?session.useCase:'finedining';
    const bucket=report[key];
    const steps=buildSteps(bucket.uc.groups);
    bucket.sessions.push(session);
    (session.tables||[]).forEach(table=>{
      (table.transactions||[]).forEach(tx=>{
        const stats=computeTxStats(session,table,tx,steps,bucket.uc.firePairs);
        bucket.txStats.push(stats);
        if(key==='clubs'){
          const venue=session.venue||'Unknown';
          (bucket.byVenue[venue]=bucket.byVenue[venue]||[]).push(stats);
        }
      });
    });
  });
  return report;
}

/* ═══════════════════════════════════════════════════════
   RENDER HELPERS
═══════════════════════════════════════════════════════ */
function barRow(label,value,max,color,n,fmt){
  const pctW=max>0&&value!==null?Math.max((value/max)*100,2):0;
  const valStr=value===null?"—":fmt(value);
  return `<div class="bar-row" title="${esc(label)}: ${esc(valStr)}${n!==undefined?` (n=${n})`:""}">
    <div class="bar-label">${esc(label)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${pctW}%;background:${color}"></div></div>
    <div class="bar-value">${valStr}${n!==undefined?`<span class="bar-n">n=${n}</span>`:""}</div>
  </div>`;
}

function renderFireToServe(bucket){
  const rows=bucket.uc.firePairs.map(pair=>{
    const vals=bucket.txStats.map(s=>s.kts[pair.label]).filter(v=>v!==undefined&&v!==null);
    return {label:pair.label,avgKt:avg(vals),n:vals.length};
  });
  if(!rows.some(r=>r.n>0))return `<div class="bar-empty">No fire→serve pairs recorded yet in the filtered sessions.</div>`;
  const max=Math.max(...rows.map(r=>r.avgKt||0),1);
  return rows.map(r=>barRow(r.label,r.avgKt,max,bucket.uc.chartColor,r.n,fmtDur)).join("");
}

function renderVenueCompare(bucket){
  const venues=bucket.uc.venues;
  const legend=venues.map(v=>`<div class="legend-item"><span class="legend-swatch" style="background:${VENUE_COLORS[v]||"var(--text-3)"}"></span>${esc(v)}</div>`).join("");
  const stats=venues.map(v=>{
    const list=bucket.byVenue[v]||[];
    const avgDur=avg(list.map(s=>s.totalDur));
    return {venue:v,avgDur,sessions:new Set(list.map(s=>s.session.id)).size,tx:list.length};
  });
  const cards=stats.map(s=>`
    <div class="venue-card" style="border-left-color:${VENUE_COLORS[s.venue]||"var(--text-3)"}">
      <div class="venue-name"><span class="venue-dot" style="background:${VENUE_COLORS[s.venue]||"var(--text-3)"}"></span>${esc(s.venue)}</div>
      <div class="venue-stat" style="color:${VENUE_COLORS[s.venue]||"var(--text-1)"}">${s.avgDur!==null?fmtDur(s.avgDur):"—"}</div>
      <div class="venue-sub">avg visit &nbsp;·&nbsp; ${s.sessions} session${s.sessions!==1?"s":""} &nbsp;·&nbsp; ${s.tx} group${s.tx!==1?"s":""}</div>
    </div>`).join("");
  return `<div class="legend-row">${legend}</div><div class="venue-grid">${cards}</div>`;
}

function renderSessionsTable(bucket){
  if(!bucket.sessions.length)return `<div class="bar-empty">No saved sessions in this view yet.</div>`;
  const rows=bucket.sessions.slice().sort((a,b)=>new Date(b.savedAt)-new Date(a.savedAt)).map(s=>{
    const txForSession=bucket.txStats.filter(t=>t.session.id===s.id);
    const avgDur=avg(txForSession.map(t=>t.totalDur));
    const avgCompletion=avg(txForSession.map(t=>t.completion));
    const venueChip=s.venue?`<span class="venue-chip" style="background:${tint(VENUE_COLORS[s.venue]||"var(--accent)",20)};color:${VENUE_COLORS[s.venue]||"var(--accent)"}">${esc(s.venue)}</span>`:"";
    return `<tr>
      <td>${esc(s.label)}</td>
      <td>${venueChip}</td>
      <td>${new Date(s.savedAt).toLocaleString('en-PH',{dateStyle:'medium',timeStyle:'short'})}</td>
      <td>${s.tableCount??(s.tables||[]).length}</td>
      <td>${s.txCount??txForSession.length}</td>
      <td>${avgDur!==null?fmtDur(avgDur):"—"}</td>
      <td>${pct(avgCompletion)}</td>
      <td><a class="open-link" href="index.html?load=${encodeURIComponent(s.id)}">Open →</a></td>
    </tr>`;
  }).join("");
  return `<div class="tbl-wrap"><table class="sessions">
    <thead><tr><th>Session</th><th>Venue</th><th>Saved</th><th>Tables</th><th>Tx</th><th>Avg Duration</th><th>Avg Completion</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

function renderSection(key,bucket){
  const uc=bucket.uc;
  const avgDur=avg(bucket.txStats.map(s=>s.totalDur));
  const avgCompletion=avg(bucket.txStats.map(s=>s.completion));
  const avgPay=avg(bucket.txStats.map(s=>s.payTime));
  return `<div class="section">
    <div class="section-hdr">
      <span style="font-size:16px">${uc.icon}</span>
      <div>
        <div class="section-title">${esc(uc.label)}</div>
        <div class="section-sub">${bucket.sessions.length} saved session${bucket.sessions.length!==1?"s":""} &nbsp;·&nbsp; ${bucket.txStats.length} observation${bucket.txStats.length!==1?"s":""}</div>
      </div>
    </div>
    <div class="section-body">
      <div class="overview-grid" style="margin-bottom:16px">
        <div class="stat-tile"><div class="stat-label" style="color:${uc.chartColor}">${esc(uc.durationLabel)}</div><div class="stat-value">${avgDur!==null?fmtDur(avgDur):"—"}</div><div class="stat-sub">average</div></div>
        <div class="stat-tile"><div class="stat-label" style="color:var(--c-serve)">Avg Completion</div><div class="stat-value">${pct(avgCompletion)}</div><div class="stat-sub">of ${buildSteps(uc.groups).length} steps</div></div>
        <div class="stat-tile"><div class="stat-label" style="color:var(--c-payment)">Avg Payment Processing</div><div class="stat-value">${avgPay!==null?fmtDur(avgPay):"—"}</div><div class="stat-sub">initiated → completed</div></div>
      </div>
      ${key==='clubs'?`<div class="sec-label">Venue Comparison</div>${renderVenueCompare(bucket)}`:""}
      <div class="sec-label">${esc(uc.fireSectionLabel)}</div>
      ${renderFireToServe(bucket)}
      <div class="sec-label">Saved Sessions</div>
      ${renderSessionsTable(bucket)}
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════
   MAIN RENDER
═══════════════════════════════════════════════════════ */
function applyFilters(){
  return allSessions.filter(s=>{
    if(filters.useCase!=='all'&&(s.useCase||'finedining')!==filters.useCase)return false;
    if(filters.venue&&s.venue!==filters.venue)return false;
    if(filters.search&&!(s.label||'').toLowerCase().includes(filters.search.toLowerCase()))return false;
    return true;
  });
}

function renderReport(){
  const filtered=applyFilters();
  const report=buildReport(filtered);
  const wrap=document.getElementById('bodyWrap');

  if(!allSessions.length){
    wrap.innerHTML=`<div class="state-msg">No saved sessions yet.<br>Save a session from the tracker to see it here.</div>`;
    return;
  }
  if(!filtered.length){
    wrap.innerHTML=`<div class="state-msg">No sessions match this filter.</div>`;
    return;
  }

  const allTxStats=[...report.finedining.txStats,...report.clubs.txStats];
  const overviewDur=avg(allTxStats.map(s=>s.totalDur));
  const overviewCompletion=avg(allTxStats.map(s=>s.completion));

  let html=`<div class="overview-grid">
    <div class="stat-tile"><div class="stat-label" style="color:var(--accent)">Total Sessions</div><div class="stat-value">${filtered.length}</div><div class="stat-sub">saved</div></div>
    <div class="stat-tile"><div class="stat-label" style="color:var(--c-serve)">Total Observations</div><div class="stat-value">${allTxStats.length}</div><div class="stat-sub">tables × transactions</div></div>
    <div class="stat-tile"><div class="stat-label" style="color:var(--c-payment)">Avg Duration (all)</div><div class="stat-value">${overviewDur!==null?fmtDur(overviewDur):"—"}</div><div class="stat-sub">across both use cases</div></div>
    <div class="stat-tile"><div class="stat-label" style="color:var(--text-2)">Avg Completion (all)</div><div class="stat-value">${pct(overviewCompletion)}</div><div class="stat-sub">steps done</div></div>
  </div>`;

  if(filters.useCase==='all'||filters.useCase==='finedining'){
    if(report.finedining.sessions.length)html+=renderSection('finedining',report.finedining);
  }
  if(filters.useCase==='all'||filters.useCase==='clubs'){
    if(report.clubs.sessions.length)html+=renderSection('clubs',report.clubs);
  }
  wrap.innerHTML=html;
}

/* ═══════════════════════════════════════════════════════
   FILTER CONTROLS
═══════════════════════════════════════════════════════ */
function setUseCaseFilter(key){
  filters.useCase=key;
  filters.venue='';
  document.querySelectorAll('[data-usecase]').forEach(b=>b.classList.toggle('sel',b.dataset.usecase===key));
  const venueGroup=document.getElementById('venueFilterGroup');
  if(key==='clubs'){
    venueGroup.style.display='flex';
    venueGroup.innerHTML=`<span class="f-label">Venue</span><button class="f-pill sel" data-venue="" onclick="setVenueFilter('')">All</button>`+
      USE_CASES.clubs.venues.map(v=>`<button class="f-pill" data-venue="${esc(v)}" onclick="setVenueFilter('${v.replace(/'/g,"\\'")}')">${esc(v)}</button>`).join("");
  }else{
    venueGroup.style.display='none';
  }
  renderReport();
}
function setVenueFilter(v){
  filters.venue=v;
  document.querySelectorAll('[data-venue]').forEach(b=>b.classList.toggle('sel',b.dataset.venue===v));
  renderReport();
}
let searchDebounce=null;
function onSearch(v){
  clearTimeout(searchDebounce);
  searchDebounce=setTimeout(()=>{filters.search=v;renderReport();},150);
}

/* ═══════════════════════════════════════════════════════
   LOAD
═══════════════════════════════════════════════════════ */
async function loadReport(){
  const wrap=document.getElementById('bodyWrap');
  wrap.innerHTML=`<div class="state-msg">Loading saved sessions…</div>`;
  try{
    const res=await fetch('/api/report');
    const data=await res.json();
    if(!res.ok){
      console.error('[report] /api/report failed:',data);
      throw new Error(data.detail||data.error||'Failed to load report');
    }
    allSessions=data.sessions||[];
    renderReport();
  }catch(err){
    wrap.innerHTML=`<div class="state-msg err">Couldn't load saved sessions: ${esc(err.message)}<br><br><button class="btn-sm" onclick="loadReport()">Try again</button></div>`;
  }
}

loadReport();
</script>
</body>
</html>
